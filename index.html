let FLAG_IDX=null;const FLAG_FOLD=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
function flagBuild(){
  FLAG_IDX={};
  try{["fr","en"].forEach(lg=>{const dn=new Intl.DisplayNames([lg],{type:"region"});Object.keys(FLAG_SVG).forEach(c=>{try{const n=dn.of(c);if(n&&n!==c)FLAG_IDX[FLAG_FOLD(n)]=c}catch(e){}})})}catch(e){}

function makeZip(name,data){
  const nb=new TextEncoder().encode(name),crc=crc32(data),n=data.length;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);
  lh.setUint32(14,crc,true);lh.setUint32(18,n,true);lh.setUint32(22,n,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);
  ch.setUint32(16,crc,true);ch.setUint32(20,n,true);ch.setUint32(24,n,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,0,true);
  const off=30+nb.length+n,cdSize=46+nb.length;
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,1,true);eo.setUint16(10,1,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);

  return out;
}

const pad2=n=>String(n).padStart(2,"0");

  }catch(e){setBk(e&&e.code==="declined"?"Enregistrement annulé.":"Enregistrement impossible ("+((e&&e.code)||"erreur")+").",true);return false}
}
function backupJson(){
  const ms={};Object.keys(majs).forEach(k=>{const c=JSON.parse(JSON.stringify(majs[k]));delete c._pending;ms[k]=c});
  const gs={};allGroups().forEach(g=>{gs[gkey(g)]=g});
  return JSON.stringify({format:"suivi-maj-sauvegarde",version:1,exportedAt:Date.now(),majs:ms,groupes:gs},null,1);
}
function csvCell(v){v=String(v==null?"":v);return /[";\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){
  const head=["Titre","Groupement","Statut","Créée le","Archivée le","Durée (heures)","Avancement (%)","Préparée par","Modules","Régions"];
  const rows=Object.keys(majs).map(k=>majs[k]).sort((a,b)=>b.created-a.created).map(m=>{
    const s=stats(m),st=m.archived?"Archivée":s.pct>=100?"Prête à archiver":"En cours";
    return [m.title,groupOf(m),st,fdate(m.created),m.archived?fdate(m.archivedAt||m.created):"",(durOf(m)/3600000).toFixed(2).replace(".",","),s.pct,m.createdBy?(who(m.createdBy)||""):"",[...new Set(m.mods.map(M=>M.name))].join(", "),[...new Set(m.mods.flatMap(M=>M.regions.map(r=>norm(r.label))))].join(", ")];
  });
  const txt="﻿"+[head,...rows].map(r=>r.map(csvCell).join(";")).join("\r\n");
  saveFile("export-maj-"+stampDay()+".csv",txt);
}

async function restoreFile(f){
  try{
    const o=JSON.parse(await f.text());
    if(!o||o.format!=="suivi-maj-sauvegarde"||typeof o.majs!=="object")throw new Error("format");
    const todo=[];let add=0,upd=0,keep=0;
    Object.entries(o.majs).forEach(([id,d])=>{
      if(!d||!Array.isArray(d.mods)||!d.title){return}
      const cur=majs[id];
      if(!cur){add++;todo.push([id,d])}
      else if((d.updatedAt||0)>(cur.updatedAt||0)){upd++;todo.push([id,d])}
      else keep++;
    });
    const have=new Set(allGroups().map(gkey));
    const groups=Object.values(o.groupes||{}).filter(n=>n&&!have.has(gkey(n)));
    restoreDialog({exportedAt:o.exportedAt||Date.now(),total:Object.keys(o.majs).length,ng:Object.keys(o.groupes||{}).length,add,upd,keep,todo,groups,newGroups:groups.length});
  }catch(e){setBk("Ce fichier n'est pas une sauvegarde valide du suivi des MAJ.",true)}
}

/* Accueil : prochaine étape d'une échéance (d'après les interrupteurs de « MAJ à venir ») */
function nextStep(e){
  const k=e.m.mails||{};
  if(e.kind==="dateSiege"){
    if(!k.prise)return ["Envoyer le rétroplanning",0];
    if(!k.siege)return ["Déposer la mise à jour sur la solution siège",0];
    if(!k.validSiege)return ["Attendre la validation du siège",0];
    return null;
  }
  if(!k.debut)return ["Lancer le début de déploiement",0];
  if(!k.fin)return ["Terminer le déploiement",0];
  if(e.m.secondPass&&!k.pass2)return ["Faire la seconde passe",0];
  return ["Archiver la MAJ",1];
}
/* Une MAJ siège déjà déposée attend la validation du siège : elle n'est en retard que si la date de déploiement est passée sans validation */
function isWaitValid(e,n){return e.kind==="dateSiege"&&n&&n[0]==="Attendre la validation du siège"}
function isLateEv(e,n,t0){
  if(e.date>=t0)return false;
  if(isWaitValid(e,n)){const D=parseD(e.m.dateDeploiement);return !!(D&&D<t0)}
  return true;
}

  const t0=startOfToday(),ev=majEvents().map(e=>({e,n:nextStep(e)})).filter(x=>x.n);
  const late=ev.filter(x=>x.e.date<t0).reverse(),soon=ev.filter(x=>x.e.date>=t0);

/* Recherche intelligente de groupements : insensible aux accents, à la casse, à la ponctuation et aux espaces, tolérante aux fautes de frappe */
const gfold=s=>fold(s).replace(/[^a-z0-9]+/g," ").trim();
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const c=[i];let mn=i;
    for(let j=1;j<=b.length;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c.push(v);if(v<mn)mn=v}
    if(mn>max)return max+1;p=c}
  return p[b.length];
}
function gScore(name,q){
  const n=gfold(name),nc=n.replace(/ /g,""),qf=gfold(q),qc=qf.replace(/ /g,"");
  if(!qc)return 0;
  if(nc===qc)return 1000;
  if(n.startsWith(qf)||nc.startsWith(qc))return 900-Math.min(80,nc.length-qc.length);
  const ws=n.split(" ");
  if(ws.some(w=>w.startsWith(qf)))return 800;
  if(nc.includes(qc))return 700;
  const qt=qf.split(" ");
  if(qt.length>1&&qt.every(t=>ws.some(w=>w.startsWith(t))||nc.includes(t)))return 600;
  if(qc.length>=3){
    const tol=qc.length<=5?1:qc.length<=9?2:3;
    let d=Math.min(lev(qc,nc.slice(0,qc.length),tol),lev(qc,nc,tol));
    ws.forEach(w=>{d=Math.min(d,lev(qc,w,tol),lev(qc,w.slice(0,qc.length),tol))});
    if(d<=tol)return 400-d*50;
    let i=0;for(const ch of nc){if(ch===qc[i])i++;if(i===qc.length)break}
    if(i===qc.length&&qc.length>=4)return 200;
  }
  return -1;
}
function searchGroups(q,limit){
  const base=allGroups();
  return base.map(g=>[g,gScore(g,q)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"fr")).slice(0,limit||8).map(x=>x[0]);
}
/* Groupements dont le nom figure dans un texte (mail du client) */
function detectGroupsInText(text){
  const tc=gfold(text).replace(/ /g,"");if(!tc)return [];
  return allGroups().map(g=>{const nc=gfold(g).replace(/ /g,"");return [g,nc.length>=4&&tc.includes(nc)?nc.length:0]}).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
}

/* ---- Partage via un fichier JSON SharePoint (un flux Power Automate), pour la copie hors claude.ai ---- */
const LSSP="suivi-maj-sp";
const spUrl=()=>getFlow(LSSP);
const spOn=()=>!col&&!!spUrl();
let spTomb={},spT=null,spBusy=false,spAgain=false,spReady=false;
try{spTomb=JSON.parse(localStorage.getItem("suivi-maj-tomb")||"{}")||{}}catch(e){}
function spDel(id){if(!spUrl())return;spTomb[id]=Date.now();try{localStorage.setItem("suivi-maj-tomb",JSON.stringify(spTomb))}catch(e){}spQueue()}
const spParse=t=>{t=String(t||"").trim();if(!t)return null;try{let d=JSON.parse(t);if(d&&typeof d==="object"&&d.$content&&!d.majs){try{d=JSON.parse(decodeURIComponent(escape(atob(d.$content))))}catch(e){return null}}return d&&typeof d==="object"?d:null}catch(e){return null}};
async function spPost(op,body){
  const u=spUrl();
  const r=await fetch(u+(u.includes("?")?"&":"?")+"op="+op,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:body||""});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.text();
}
function spMerge(d){
  if(!d)return;
  Object.assign(spTomb,d.deleted||{});
  Object.entries(d.majs||{}).forEach(([k,v])=>{
    if(spTomb[k]||!v||!Array.isArray(v.mods))return;
    seen.add(k);majs[k]=mergeMaj(majs[k],v);upgradeMaj(majs[k]);
  });
  Object.keys(spTomb).forEach(k=>{delete majs[k]});
  Object.entries(d.groupes||{}).forEach(([k,n])=>{const nm=n&&typeof n==="object"?n.name:n;if(nm)gmap[k]=nm});
  if(d.delai&&typeof d.delai==="object"&&!spT&&!spBusy){gdelai=Object.assign({},d.delai)}
  try{localStorage.setItem(LS,JSON.stringify(majs));localStorage.setItem(LSG,JSON.stringify(gmap));localStorage.setItem("suivi-maj-delai",JSON.stringify(gdelai));localStorage.setItem("suivi-maj-tomb",JSON.stringify(spTomb))}catch(e){}
}
function spStamp(){const t=new Date().toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit"});return t}
async function spLoad(){
  if(!spOn()||spBusy)return;
  const before=JSON.stringify(majs)+JSON.stringify(gmap);
  try{
    spMerge(spParse(await spPost("read")));
    if(cur&&!majs[cur])cur=null;
    syncTxt="Synchronisé via SharePoint ("+spStamp()+")";
    const a=document.activeElement;
    if(before!==JSON.stringify(majs)+JSON.stringify(gmap)&&!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")))render();else paintSync();
    if(!spReady){spReady=true;spQueue()}
  }catch(e){syncTxt="Lecture SharePoint impossible : "+(e&&e.message||e);paintSync()}
}
async function spSave(){
  spT=null;
  if(!spOn())return;
  if(spBusy){spAgain=true;return}
  spBusy=true;syncTxt="Enregistrement…";paintSync();
  try{
    spMerge(spParse(await spPost("read")));
    const out={format:"suivi-maj-donnees",version:2,savedAt:Date.now(),majs:{},deleted:spTomb,groupes:{},delai:gdelai};
    Object.keys(majs).forEach(k=>{const c=JSON.parse(JSON.stringify(majs[k]));delete c._pending;out.majs[k]=c});
    allGroups().forEach(g=>{out.groupes[gkey(g)]=g});
    await spPost("write",JSON.stringify(out));
    syncTxt="Enregistré dans SharePoint ("+spStamp()+")";
  }catch(e){syncTxt="Échec SharePoint : "+(e&&e.message||e)}
  spBusy=false;paintSync();
  if(spAgain){spAgain=false;spQueue()}
}
function spQueue(){if(!spOn())return;clearTimeout(spT);spT=setTimeout(spSave,1200)}
let spStarted=false;
function spInit(){
  if(!spOn()||spStarted)return;spStarted=true;
  spLoad();
  setInterval(()=>{if(document.visibilityState==="visible")spLoad()},60000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")spLoad()});
}
const APP_VERSION="v215",APP_DATE="21/10/2026";
function render(){
  {const av=document.getElementById("appver");if(av)av.textContent="Suivi de préparation des MAJ · "+APP_VERSION+" · "+APP_DATE}
  const app=document.getElementById("app");
  app.classList.toggle("wide",!(cur&&majs[cur])&&page==="archived");
  const keepY=window.scrollY;
  app.textContent="";
  if(cur&&majs[cur])viewMaj(app,cur);else if(page==='hub')viewHub(app);else if(page==='search')viewSearch(app);else if(page==='live')viewLive(app,false);else if(page==='archived')viewLive(app,true);else if(page==='upcoming')viewUpcoming(app);else viewHome(app);
  window.scrollTo(0,keepY);
}
render();

(async()=>{
  try{
    const c=window.claude;if(!c){spInit();return}
    c.use("sample").then(s=>{sampleFn=s||null}).catch(()=>{});
    c.use("user").then(async u=>{if(u){userApi=u;try{myId=await u.id()}catch(e){}resolveNames()}}).catch(()=>{});
    const db=await c.use("db");
    if(!db){syncTxt="Sauvegarde locale uniquement";paintSync();spInit();return}
    gcol=db.collection("groupes");xcol=db.collection("xmlfiles");
    gcol.onSnapshot(sn=>{
      gdelai={};sn.docs.forEach(d=>{const v=d.data();if(v&&v.name)gmap[d.id]=v.name;if(v&&v.delai===5)gdelai[d.id]=5});try{localStorage.setItem("suivi-maj-delai",JSON.stringify(gdelai))}catch(e){}
      try{localStorage.setItem(LSG,JSON.stringify(gmap))}catch(e){}
      if(cdlg&&cdlg.refresh)cdlg.refresh();
    },()=>{});
    col=db.collection("majs");
    let first=true;
    col.onSnapshot(snap=>{
      const remote={};snap.docs.forEach(d=>{const v=d.data();if(v&&Array.isArray(v.mods))remote[d.id]=v});
      if(first){first=false;Object.keys(majs).forEach(k=>{if(!remote[k]){if(majs[k]._pending){const f=JSON.parse(JSON.stringify(majs[k]));delete f._pending;delete majs[k]._pending;col.doc(k).set(f).catch(()=>{})}else delete majs[k]}})}
      Object.keys(remote).forEach(k=>{
        seen.add(k);
        majs[k]=mergeMaj(majs[k],remote[k]);
        if(upgradeMaj(majs[k]))persist(k,"*");
      });
      if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites)Object.keys(majs).forEach(k=>{if(seen.has(k)&&!remote[k])delete majs[k]});
      if(cur&&!majs[cur])cur=null;
      Object.keys(majs).forEach(k=>{const m=majs[k];{const before=m.title;stampTitle(m);if(m.title!==before){persist(k)}}});
      syncTxt="Synchronisé";resolveNames();
      try{localStorage.setItem(LS,JSON.stringify(majs))}catch(e){}
      const a=document.activeElement;
      if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")))render();else paintSync();
    },()=>{syncTxt="Sauvegarde locale uniquement";paintSync()});
  }catch(e){syncTxt="Sauvegarde locale uniquement";paintSync()}
})();
</script>

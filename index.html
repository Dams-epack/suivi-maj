/* ---- Analyse du mail ---- */
const norm=l=>String(l).replace(/\bblux(?:embourg)?[\s-]*(FR|NL)\b/i,(m,c)=>"BE-"+c.toUpperCase());
function localParse(mail){
  const mods=[];
  mail.split(/\r?\n/).forEach(raw=>{
    const line=raw.replace(/^[\s•\-\*–·▪●○◦>\d.)]+/,"").trim();
    const m=line.match(/^(.+?)\s*\(([^)]+)\)\s*\.?$/);
    if(!m){
      if(/^\s*[•\-\*–·▪●○◦]\s+/.test(raw)&&line.length>=3&&line.length<=80&&!/[:?!]$/.test(line))mods.push({name:line.replace(/[.;,]+$/,"").trim(),regions:["FR"]});
      return;
    }
    const name=m[1].trim();
    let parts=m[2].split(/,|;|\s+et\s+|\s+&\s+/i).map(x=>x.trim()).filter(Boolean);
    const regions=[];let prefix="";
    parts.forEach(p=>{
      if(/^[A-Z]{2,3}$/.test(p)&&prefix)regions.push(prefix+" "+p);
      else{regions.push(p);const w=p.split(/\s+/);prefix=(w.length===2&&/^[A-Z]{2,3}$/.test(w[1]))?w[0]:(prefix&&/^[A-Z]{2,3}$/.test(w[w.length-1])?w.slice(0,-1).join(" "):"")}
    });
    if(name&&regions.length)mods.push({name,regions,b:/^\s*([•\-\*–·▪●○◦]|\d+[.)])\s+/.test(raw)});
  });
  return mods;
}
const SKIPDOM=/^(epackpro|e-pack|epack|chrgroup|chr-group|gmail|outlook|hotmail|live|yahoo|orange|wanadoo|free|sfr|laposte|google|microsoft|office|office365|sharepoint|onmicrosoft|facebook|instagram|linkedin|youtube|twitter|wetransfer|teams|zoom|bing|apple|icloud)$/i;
function domainGroup(mail){
  const labels=[];
  for(const m of mail.matchAll(/https?:\/\/(?:www\.)?([a-z0-9-]+)\.[a-z.]{2,}/gi))labels.push(m[1]);
  for(const m of mail.matchAll(/@([a-z0-9-]+)\.[a-z.]{2,}/gi))labels.push(m[1]);
  const l=labels.find(x=>!SKIPDOM.test(x)&&x.length>2);
  return l?l.replace(/[-_]+/g," "):"";
}
const STOPW=new Set(["et","ou","de","du","des","la","le","les","un","une","pour","qui","que","sur","dans","avec","via","en","au","aux","ce","cette","ci","joint","concerne","suivant","suivants"]);
function proseModules(mail){
  const out=[];
  for(const m of mail.matchAll(/\bmodules?\s+(?:d['’]\s*)?([\p{L}'’-]{3,})/giu)){
    const w=m[1];if(STOPW.has(w.toLowerCase()))continue;
    const name=w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
    if(!out.some(x=>x.name.toLowerCase()===name.toLowerCase()))out.push({name,regions:["FR"]});
  }
  return out;
}
function localGroup(mail){
  const m=mail.match(/(?:[Gg]roupement|[Gg]roupe|[Ee]nseigne)\s*[:\-]?\s+([A-ZÀ-Ý][^\n,.;()]{1,40})/);
  return m?m[1].trim():"";
}
/* ---- Lecture d'un fichier mail ---- */
function qpDecode(str,cs){
  const raw=str.replace(/=\r?\n/g,"").replace(/=([0-9A-Fa-f]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
  return decBytes(Uint8Array.from(raw,c=>c.charCodeAt(0)&255),cs);
}
function decBytes(u8,cs){try{return new TextDecoder((cs||"utf-8").toLowerCase()).decode(u8)}catch(e){return new TextDecoder("utf-8").decode(u8)}}
function stripHtml(h){
  return h.replace(/<(style|script)[\s\S]*?<\/\1>/gi,"").replace(/<br\s*\/?>|<\/(p|div|li|tr|h\d)>/gi,"\n").replace(/<li[^>]*>/gi,"• ")
   .replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&bull;/g,"•")
   .replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n");
}
function splitMime(t){const i=t.search(/\r?\n\r?\n/);if(i<0)return [t,""];const m=t.slice(i).match(/^\r?\n\r?\n/);return [t.slice(0,i),t.slice(i+m[0].length)]}
function hdr(h,name){const m=h.replace(/\r?\n[ \t]+/g," ").match(new RegExp("^"+name+":\\s*(.*)$","im"));return m?m[1]:""}
function partText(h,body){
  const enc=hdr(h,"Content-Transfer-Encoding").trim().toLowerCase();
  const cs=(hdr(h,"Content-Type").match(/charset="?([\w-]+)/i)||[])[1]||"utf-8";
  if(enc==="base64"){const bin=atob(body.replace(/\s+/g,""));return decBytes(Uint8Array.from(bin,c=>c.charCodeAt(0)),cs)}
  if(enc==="quoted-printable")return qpDecode(body,cs);
  return decBytes(Uint8Array.from(body,c=>c.charCodeAt(0)&255),cs);
}
function parseMime(t,depth){
  const [h,body]=splitMime(t);
  const ct=hdr(h,"Content-Type");
  const bm=ct.match(/boundary="?([^";]+)"?/i);
  if(/multipart/i.test(ct)&&bm&&(depth||0)<6){
    const parts=body.split("--"+bm[1]).slice(1).filter(p=>!/^--/.test(p.trim().slice(0,2))||p.trim().length>2);
    let plain="",html="";
    parts.forEach(p=>{
      const r=parseMime(p.replace(/^\r?\n/,""),(depth||0)+1);
      if(r.plain&&!plain)plain=r.plain;if(r.html&&!html)html=r.html;
    });
    return {plain,html};
  }
  if(/text\/html/i.test(ct))return {plain:"",html:partText(h,body)};
  if(!ct||/text\/plain/i.test(ct))return {plain:partText(h,body),html:""};
  return {plain:"",html:""};
}
function parseEml(latin1){
  const r=parseMime(latin1,0);
  return r.plain.trim()?r.plain:stripHtml(r.html);
}
function cleanLines(t){
  return t.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffd\u007f-\u009f]+/g,"\n").split(/\r?\n|\r/).map(x=>x.trim())
    .filter(x=>x.length>=3&&/^[\p{L}\p{N}\p{P}\p{S}\p{Zs}]+$/u.test(x)).join("\n");
}
function extractMsg(u8){
  const a=cleanLines(new TextDecoder("utf-16le").decode(u8));
  const b=cleanLines(new TextDecoder("windows-1252").decode(u8));
  return localParse(b).length>localParse(a).length?b:a;
}
async function readMailFile(file){
  const u8=new Uint8Array(await file.arrayBuffer());
  const name=file.name.toLowerCase();
  const latin=()=>{let s="";const C=8192;for(let i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return s};
  if(/\.msg$/.test(name)||(u8[0]===0xD0&&u8[1]===0xCF&&u8[2]===0x11&&u8[3]===0xE0))return extractMsg(u8);
  if(/\.(eml|mht|mhtml)$/.test(name)||/^(Received|From|Date|Subject|MIME-Version|Return-Path|X-[\w-]+|Content-Type):/im.test(latin().slice(0,2000)))return parseEml(latin());
  const txt=new TextDecoder("utf-8").decode(u8);
  return /\.html?$/.test(name)||/<html|<body|<br/i.test(txt.slice(0,3000))?stripHtml(txt):txt;
}
async function loadFile(file){
  if(!file)return;
  draft.fileName=file.name;draft.parsed=null;
  if(/\.(pdf|docx?|xlsx?|png|jpe?g|zip)$/i.test(file.name)){

  try{
    const t=(await readMailFile(file)).trim();
    if(!t){draft.msg="Je n'ai pas réussi à lire ce fichier. Colle le texte du mail à la place.";draft.err=true;render();return}
    draft.mail=t;draft.msg="";draft.err=false;render();

}

async function analyse(){
  const mail=draft.mail.trim();
  if(!mail){draft.msg="Colle d'abord le mail du client.";draft.err=true;render();return}
  draft.busy=true;draft.msg="Analyse en cours…";draft.err=false;draft.parsed=null;render();
  let mods=null, group="";
  if(sampleFn){
    try{
      const r=await sampleFn.json(
        "Voici un mail client demandant des mises à jour de modules d'un logiciel de sécurité alimentaire. Extrais : (1) le nom COMPLET du groupement, de l'enseigne ou du client si tu le reconnais clairement dans le mail (signature, objet, expéditeur, corps, liens et adresses de sites web), sinon une chaîne vide, sans rien inventer. Donne le nom entier tel que l'enseigne le porte, avec ses mots génériques (par exemple « Boulangerie Ange » et non « Ange »). Ne prends jamais « ePackPro », « E-Pack » ou « e-pack » comme groupement : c'est le nom du logiciel utilisé, pas le client ; (2) la liste des modules à modifier et, pour chacun, les régions ou langues concernées. "+
        "Si le mail écrit 'Blux FR et NL', sépare en deux régions : 'Blux FR' et 'Blux NL'. Garde les noms de modules et de régions tels qu'écrits dans le mail (corrige seulement la casse évidente). "+
        "Les modules peuvent être cités dans une phrase (par exemple « via le module étiquette et le module traçabilité ») : relève-les aussi, avec un nom court et propre (« Étiquette », « Traçabilité »). Ignore les tableaux de produits ou d'ingrédients : ce ne sont pas des modules. Si le mail ne mentionne ni région ni langue différentes pour un module, renvoie une seule région : \"FR\". "+
        "Réponds uniquement avec ce JSON : {\"group\":\"...\",\"modules\":[{\"name\":\"...\",\"regions\":[\"...\"]}]}. Si aucun module n'est identifiable, renvoie {\"group\":\"\",\"modules\":[]}.\n\nMail :\n"+mail,
        {modelTier:"quick",cache:false});
      if(r&&typeof r.group==="string")group=r.group.trim();
      if(r&&Array.isArray(r.modules))mods=r.modules.filter(m=>m&&m.name&&Array.isArray(m.regions)&&m.regions.length).map(m=>({name:String(m.name),regions:m.regions.map(String)}));
    }catch(e){mods=null}
  }
  if(!mods||!mods.length){
    const lp=localParse(mail),bl=lp.filter(m=>m.b);
    if(bl.length)mods=bl;
    else{const pr=proseModules(mail);mods=pr.length?pr:lp}
  }
  if(!group)group=localGroup(mail)||domainGroup(mail);
  {const dom=domainGroup(mail);if(dom&&group&&dom.toLowerCase().includes(group.toLowerCase())&&dom.length>group.length)group=dom}
  draft.group=group.replace(/\s+/g," ").trim().slice(0,60).toUpperCase();
  mods=mods.map(m=>({name:m.name,regions:m.regions.map(norm)}));
  draft.busy=false;

  else{draft.parsed=mods;draft.msg="";draft.err=false}

}

function stats(m){

  m.mods.forEach(M=>M.regions.forEach(r=>{const s=(m.prog[M.id+"_"+r.key]||{s:[0,0,0]}).s;const L=stepsOf(M).length;const n=s.slice(0,L).filter(Boolean).length;total+=L;done+=n;rows++;if(n===L)rd++}));
  return {total,done,rows,rd,pct:total?Math.round(100*done/total):0};
}

function ensureRootAttrs(text,el,attrs){
  if(!attrs)return [text,false];
  const m=new RegExp(`<ArrayOf${el}(?<attrs>[^>]*)>`).exec(text);
  if(!m)return [text,false];
  const existing=m.groups.attrs;
  const names=new Set([...existing.matchAll(/([\w:.\-]+)\s*=/g)].map(x=>x[1]));
  const missing=[...attrs.matchAll(/[\w:.\-]+\s*=\s*"[^"]*"/g)].map(x=>x[0]).filter(a=>!names.has(/([\w:.\-]+)\s*=/.exec(a)[1]));
  if(!missing.length)return [text,false];
  const nopen=`<ArrayOf${el}${existing.replace(/\s+$/,"")} ${missing.join(" ")}>`;
  return [text.slice(0,m.index)+nopen+text.slice(m.index+m[0].length),true];

function ensureDecl(text,enc){
  if(!enc)return [text,false];
  const m=/^<\?xml[^>]*\?>/.exec(text);

  if(nd===decl)return [text,false];

function reorderBody(body,order,indent,eol){
  const items=directChildren(body);
  if(!items.length)return [body,[]];
  const rank=new Map(order.map((t,i)=>[t.toLowerCase(),i]));
  const unknown=items.filter(([t])=>!rank.has(t.toLowerCase())).map(([t])=>t);
  const sorted=items.slice().sort((a,b)=>(rank.has(a[0].toLowerCase())?rank.get(a[0].toLowerCase()):order.length)-(rank.has(b[0].toLowerCase())?rank.get(b[0].toLowerCase()):order.length));

async function restoreFile(f){
  try{
    const o=JSON.parse(await f.text());
    if(!o||o.format!=="suivi-maj-sauvegarde"||typeof o.majs!=="object")throw new Error("format");
    const todo=[];let add=0,upd=0,keep=0;
    Object.entries(o.majs).forEach(([id,d])=>{
      if(!d||!Array.isArray(d.mods)||!d.title){return}
      const cur=majs[id];
      if(!cur){add++;todo.push([id,d])}
      else if((d.updatedAt||0)>(cur.updatedAt||0)){upd++;todo.push([id,d])}
      else keep++;
    });
    const have=new Set(allGroups().map(gkey));
    const groups=Object.values(o.groupes||{}).filter(n=>n&&!have.has(gkey(n)));
    restoreDialog({exportedAt:o.exportedAt||Date.now(),total:Object.keys(o.majs).length,ng:Object.keys(o.groupes||{}).length,add,upd,keep,todo,groups,newGroups:groups.length});
  }catch(e){setBk("Ce fichier n'est pas une sauvegarde valide du suivi des MAJ.",true)}
}

  }
  function choose(o){
    const g=o.t==="add"?registerGroup(o.g):o.g;if(!g)return;
    st.group=g;gi.value=g;open=false;act=-1;paintCombo();gmsg.textContent="Groupement choisi : "+g;check();
  }
  gi.oninput=()=>{st.group="";gmsg.textContent="";open=true;act=gi.value.trim()?0:-1;paintCombo();check()};
  let quiet=true;
  gi.onfocus=()=>{if(quiet){quiet=false;return}if(!st.group){open=true;paintCombo()}else{gi.select()}};
  gi.onclick=()=>{if(!st.group&&!open){open=true;paintCombo()}};
  gi.onblur=()=>{open=false;paintCombo();if(!st.group&&gi.value.trim()){gmsg.textContent="Choisis un groupe dans la liste ou ajoute-le (Entrée)."}};
  gi.onkeydown=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();if(!open){open=true;act=0}else act=Math.min(opts.length-1,act+1);paintCombo()}
    else if(e.key==="ArrowUp"){e.preventDefault();act=Math.max(0,act-1);paintCombo()}
    else if(e.key==="Enter"){if(open&&opts[act]){e.preventDefault();choose(opts[act])}else if(open&&opts[0]&&gi.value.trim()){e.preventDefault();choose(opts[0])}}
    else if(e.key==="Escape"&&open){e.preventDefault();e.stopPropagation();open=false;paintCombo()}
    else if(e.key==="Tab"&&open&&opts[act]&&gi.value.trim()){choose(opts[act])}
  };
  arrow.onmousedown=e=>{e.preventDefault();open=!open;if(open){gi.focus()}paintCombo()};
  // regions
  const rl=$("div","fld");
  const rh=$("div","rhead");rh.appendChild($("span",null,"Régions / langues"));
  const rall=$("button","rlink","Toutes");rall.type="button";
  const rnone=$("button","rlink","Aucune");rnone.type="button";
  const rcnt=$("span","rcnt");
  rh.append(rall,rnone,rcnt);rl.appendChild(rh);
  const rw=$("div","rpills");rl.appendChild(rw);md.appendChild(rl);
  let adding=false;
  // concepts : facultatif et ephemere (propre a ce suivi, jamais memorise dans une liste)
  const cl=$("div","fld");
  const ch=$("div","rhead");ch.appendChild($("span",null,"Concept (facultatif)"));const ccnt=$("span","rcnt");ch.appendChild(ccnt);cl.appendChild(ch);
  const cw2=$("div","rpills");cl.appendChild(cw2);
  cl.appendChild($("small","gmsg","Ex. La Boucherie, La Boucherie + KDB. Une ligne par région et par concept ; rien n'est mémorisé en dehors de ce suivi."));
  md.appendChild(cl);
  let cadding=false;
  function paintConcepts(){
    cw2.textContent="";
    st.concepts.forEach(c=>{
      const b=$("button","rp");b.type="button";b.setAttribute("aria-pressed",String(st.csel.has(c)));b.append(c);
      const x=$("span","rx","×");x.title="Retirer";x.setAttribute("role","button");x.setAttribute("aria-label","Retirer "+c);x.onclick=e=>{e.stopPropagation();st.concepts=st.concepts.filter(v=>v!==c);st.csel.delete(c);paintConcepts();check()};b.appendChild(x);
      b.onclick=()=>{st.csel.has(c)?st.csel.delete(c):st.csel.add(c);paintConcepts();check()};
      cw2.appendChild(b);
    });
    if(cadding){
      const e=$("span","rp edit");const i=$("input","ri");i.type="text";i.placeholder="Nom du concept…";i.maxLength=40;i.setAttribute("aria-label","Ajouter un concept");
      const ok2=$("button",null,"✓");ok2.type="button";ok2.setAttribute("aria-label","Ajouter");
      const go=()=>{const v=i.value.replace(/\s+/g," ").trim();cadding=false;if(v){if(!st.concepts.includes(v))st.concepts.push(v);st.csel.add(v)}paintConcepts();check()};
      ok2.onclick=go;i.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();go()}else if(ev.key==="Escape"){ev.preventDefault();ev.stopPropagation();cadding=false;paintConcepts()}};
      i.onblur=()=>{setTimeout(()=>{if(cadding&&!i.value.trim()){cadding=false;paintConcepts()}},150)};
      e.append(i,ok2);cw2.appendChild(e);setTimeout(()=>i.focus(),0);
    }else{
      const pl=$("button","rp plus","+ Concept");pl.type="button";pl.onclick=()=>{cadding=true;paintConcepts()};cw2.appendChild(pl);
    }
  }
  // modules
  const ml=$("div","fld");
  const mh=$("div","rhead");mh.appendChild($("span",null,"Modules à suivre"));
  const mex=$("button","rlink","Tout déplier");mex.type="button";
  const mco=$("button","rlink","Tout réduire");mco.type="button";
  mh.append(mex,mco);ml.appendChild(mh);
  const fi=$("input");fi.type="search";fi.placeholder="Filtrer les modules";fi.setAttribute("aria-label","Filtrer les modules");ml.appendChild(fi);
  const list=$("div","mlist");ml.appendChild(list);md.appendChild(ml);
  const ac=$("div","actions");
  const ok=$("button","btn","Créer le suivi");const no=$("button","btn ghost","Annuler");
  const cnt=$("span","msg");
  ac.append(ok,no,cnt);md.appendChild(ac);
const FLAGS={FR:"linear-gradient(90deg,#1f3f9a 33%,#fff 33% 66%,#d62b3b 66%)","La Réunion":"linear-gradient(90deg,#1f3f9a 33%,#fff 33% 66%,#d62b3b 66%)",Antilles:"linear-gradient(90deg,#1f3f9a 33%,#fff 33% 66%,#d62b3b 66%)","Nouvelle Calédonie":"linear-gradient(90deg,#1f3f9a 33%,#fff 33% 66%,#d62b3b 66%)","BE-FR":"linear-gradient(90deg,#222 33%,#f6c915 33% 66%,#d62b3b 66%)","BE-NL":"linear-gradient(90deg,#222 33%,#f6c915 33% 66%,#d62b3b 66%)",IT:"linear-gradient(90deg,#1f9a4a 33%,#fff 33% 66%,#d62b3b 66%)",ES:"linear-gradient(180deg,#c8312f 25%,#f6c915 25% 75%,#c8312f 75%)",DE:"linear-gradient(180deg,#222 33%,#d62b3b 33% 66%,#f6c915 66%)"};
  function paintRegs(){
    rw.textContent="";
    const CAP={"FR":"France métropolitaine","La Réunion":"Océan Indien","Antilles":"Guadeloupe, Martinique","Nouvelle Calédonie":"Pacifique","BE-FR":"Belgique francophone","BE-NL":"Belgique néerlandophone","IT":"Italie","ES":"Espagne","DE":"Allemagne"};
    const pill=(r,extra)=>{
      const b=$("button","rp");b.type="button";b.setAttribute("aria-pressed",String(st.regs.has(r)));if(CAP[r])b.title=CAP[r];
      const fl=$("span","fl");fl.style.background=FLAGS[r]||"linear-gradient(135deg,#8aa 0 50%,#567 50%)";b.append(fl,r);
      if(extra){const x=$("span","rx","×");x.title="Retirer";x.setAttribute("role","button");x.setAttribute("aria-label","Retirer "+r);x.onclick=e=>{e.stopPropagation();st.extra=st.extra.filter(v=>v!==r);st.regs.delete(r);paintRegs();check()};b.appendChild(x)}
      b.onclick=()=>{st.regs.has(r)?st.regs.delete(r):st.regs.add(r);paintRegs();check()};return b;
    };
    REGIONS.forEach(r=>rw.appendChild(pill(r,false)));
    st.extra.forEach(r=>rw.appendChild(pill(r,true)));
    if(adding){
      const e=$("span","rp edit");const i=$("input","ri");i.type="text";i.placeholder="Autre région…";i.maxLength=30;i.setAttribute("aria-label","Ajouter une autre région");
      const ok2=$("button",null,"✓");ok2.type="button";ok2.setAttribute("aria-label","Ajouter");
      const go=()=>{const v=norm(i.value.trim());adding=false;if(v){if(![...REGIONS,...st.extra].includes(v))st.extra.push(v);st.regs.add(v)}paintRegs();check()};
      ok2.onclick=go;i.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();go()}else if(ev.key==="Escape"){ev.preventDefault();ev.stopPropagation();adding=false;paintRegs()}};
      i.onblur=()=>{setTimeout(()=>{if(adding&&!i.value.trim()){adding=false;paintRegs()}},150)};
      e.append(i,ok2);rw.appendChild(e);setTimeout(()=>i.focus(),0);
    }else{
      const pl=$("button","rp plus","+ Autre");pl.type="button";pl.onclick=()=>{adding=true;paintRegs()};rw.appendChild(pl);
    }
  }
  function paintMods(){
    list.textContent="";
    const f=fold(st.filter);let any=false;
    CATALOG.forEach(([cat,names])=>{
      const vis=names.filter(n=>!f||fold(n).includes(f)||fold(cat).includes(f));if(!vis.length)return;any=true;
      const fs=$("fieldset","cat");const lg=$("legend");
      const allOn=vis.every(n=>st.mods.has(n));
      const tg=$("button","chip",allOn?"Tout décocher":"Tout cocher");tg.type="button";tg.onclick=()=>{vis.forEach(n=>allOn?st.mods.delete(n):st.mods.add(n));paintMods();check()};
      const isOpen=!!f||!st.closed.has(cat);
      const hd=$("button","cathead");hd.type="button";hd.setAttribute("aria-expanded",String(isOpen));
      hd.append($("span","catcar","▾"),$("span",null,cat));
      hd.onclick=()=>{if(f)return;st.closed.has(cat)?st.closed.delete(cat):st.closed.add(cat);paintMods()};
      if(f)hd.style.cursor="default";
      const ct=$("span","catcnt");
      const upd=()=>{const s=names.filter(n=>st.mods.has(n)).length;ct.textContent=s+" / "+names.length;ct.classList.toggle("on",s>0)};upd();
      lg.append(hd,ct,tg);fs.appendChild(lg);
      if(!isOpen)fs.classList.add("shut");
      if(isOpen)vis.forEach(n=>{
        const l=$("label","chk");const c=$("input");c.type="checkbox";c.checked=st.mods.has(n);
        c.onchange=()=>{c.checked?st.mods.add(n):st.mods.delete(n);check();upd()};
        l.append(c,$("span",null,n));fs.appendChild(l);
      });
      list.appendChild(fs);
    });
    if(!any)list.appendChild($("p","empty","Aucun module ne correspond."));
  }
  function check(){
    const g=st.group;
    const n=st.mods.size,r=st.regs.size;
    ok.disabled=!(g&&n&&r);
    const c=st.csel.size;
    cnt.textContent=n+" module"+(n>1?"s":"")+" · "+r+" région"+(r>1?"s":"")+(c?" × "+c+" concept"+(c>1?"s":"")+" = "+r*c+" lignes par module":"");
    rcnt.textContent=r+" sélectionnée"+(r>1?"s":"");
    ccnt.textContent=c?c+" sélectionné"+(c>1?"s":""):"";
  }
  fi.oninput=()=>{st.filter=fi.value;paintMods()};
  mex.onclick=()=>{st.closed.clear();paintMods()};
  mco.onclick=()=>{CATALOG.forEach(([c])=>st.closed.add(c));paintMods()};
  rall.onclick=()=>{[...REGIONS,...st.extra].forEach(r=>st.regs.add(r));paintRegs();check()};
  rnone.onclick=()=>{st.regs.clear();paintRegs();check()};
  no.onclick=closeCustom;
  ok.onclick=()=>{
    const g=st.group;if(!g||!st.mods.size||!st.regs.size)return;
    const names=CATALOG.flatMap(([,a])=>a).filter(n=>st.mods.has(n));
    const regs=[...REGIONS,...st.extra].filter(r=>st.regs.has(r));
    const cons=st.concepts.filter(c=>st.csel.has(c));
    draft.group=g;draft.parsed=names.map(n=>({name:n,regions:cons.length?cons.flatMap(c=>regs.map(r=>({label:r,concept:c}))):regs.slice()}));
    closeCustom();createMaj();
  };
  cdlg.refresh=()=>{if(open)paintCombo()};
  paintRegs();paintConcepts();paintMods();check();
  setTimeout(()=>gi.focus(),0);
}
/*CUSTOM-END*/

function render(){
  const app=document.getElementById("app");
  const keepY=window.scrollY;
  app.textContent="";
  if(cur&&majs[cur])viewMaj(app,cur);else if(page==='hub')viewHub(app);else if(page==='search')viewSearch(app);else viewHome(app);
  window.scrollTo(0,keepY);
}
render();

(async()=>{
  try{
    const c=window.claude;if(!c)return;
    c.use("sample").then(s=>{sampleFn=s||null}).catch(()=>{});
    c.use("user").then(async u=>{if(u){userApi=u;try{myId=await u.id()}catch(e){}resolveNames()}}).catch(()=>{});
    const db=await c.use("db");
    if(!db){syncTxt="Sauvegarde locale uniquement";paintSync();return}
    gcol=db.collection("groupes");
    gcol.onSnapshot(sn=>{
      sn.docs.forEach(d=>{const v=d.data();if(v&&v.name)gmap[d.id]=v.name});
      try{localStorage.setItem(LSG,JSON.stringify(gmap))}catch(e){}
      if(cdlg&&cdlg.refresh)cdlg.refresh();
    },()=>{});
    col=db.collection("majs");
    let first=true;
    col.onSnapshot(snap=>{
      const remote={};snap.docs.forEach(d=>{const v=d.data();if(v&&Array.isArray(v.mods))remote[d.id]=v});
      if(first){first=false;Object.keys(majs).forEach(k=>{if(!remote[k]){if(majs[k]._pending){const f=JSON.parse(JSON.stringify(majs[k]));delete f._pending;delete majs[k]._pending;col.doc(k).set(f).catch(()=>{})}else delete majs[k]}})}
      Object.keys(remote).forEach(k=>{
        seen.add(k);
        majs[k]=mergeMaj(majs[k],remote[k]);
      });
      if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites)Object.keys(majs).forEach(k=>{if(seen.has(k)&&!remote[k])delete majs[k]});
      if(cur&&!majs[cur])cur=null;
      Object.keys(majs).forEach(k=>{const m=majs[k];if(m.archived){const before=m.title;stampTitle(m);if(m.title!==before){persist(k)}}});
      syncTxt="Synchronisé";resolveNames();
      try{localStorage.setItem(LS,JSON.stringify(majs))}catch(e){}
      const a=document.activeElement;
      if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")))render();else paintSync();
    },()=>{syncTxt="Sauvegarde locale uniquement";paintSync()});
  }catch(e){syncTxt="Sauvegarde locale uniquement";paintSync()}
})();
</script>
